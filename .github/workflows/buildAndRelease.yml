name: Build and Release
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing published release tag, e.g. v1.3.0-rc.1
        required: true
permissions:
  contents: write
concurrency:
  group: frontend-assets-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false
jobs:
  build-and-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select immutable release source
        env:
          REQUESTED_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: python3 deploy/release/release.py select-tag --version "$REQUESTED_TAG"
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
      - name: Install locked dependencies and build
        run: |
          corepack enable
          corepack prepare pnpm@10.8.0 --activate
          pnpm install --frozen-lockfile
          pnpm build
          git rev-parse HEAD > dist/SOURCE_COMMIT
      - name: Package and upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && zip -r "../thingspanel-frontend-$VERSION.zip" .)
          tar -czf "thingspanel-frontend-$VERSION.tar.gz" -C dist .
          gh release upload "$VERSION" "thingspanel-frontend-$VERSION.zip" "thingspanel-frontend-$VERSION.tar.gz" --clobber
