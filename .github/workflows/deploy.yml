name: ssh deploy
on:
  push:
    branches: [ "master" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci-deploy
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.11
      - name: Cache pnpm modules
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-
      - name: Install dependencies and build
        run: |
          npm install -g pnpm@8.15.5
          pnpm i
          pnpm run build:4096
      - name: Compress build output
        run: tar -czf dist.tar.gz -C dist .
      - name: Clean target directory via Tailscale SSH
        run: |
          set -euo pipefail
          tailscale ssh root@100.126.67.60 'bash -s' <<'REMOTE_SCRIPT'
          set -euo pipefail
          cd /home/thingspanel/nginx/www
          rm -rf dist.tar.gz
          mkdir -p dist
          rm -rf dist/*
          REMOTE_SCRIPT
      - name: Upload via Tailscale SSH
        run: |
          set -euo pipefail
          tailscale ssh root@100.126.67.60 'cat > /home/thingspanel/nginx/www/dist.tar.gz' < dist.tar.gz
      - name: Deploy via Tailscale SSH
        run: |
          set -euo pipefail
          tailscale ssh root@100.126.67.60 'bash -s' <<'REMOTE_SCRIPT'
          set -euo pipefail
          cd /home/thingspanel/nginx/www
          tar -xzf dist.tar.gz -C dist
          rm -f dist.tar.gz
          nginx -t && nginx -s reload
          echo "Deployment completed successfully."
          REMOTE_SCRIPT
