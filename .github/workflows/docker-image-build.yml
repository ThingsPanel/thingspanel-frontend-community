name: Docker Image Build
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Existing published release tag, e.g. v1.3.0-rc.1
        required: true
permissions:
  contents: write
  packages: write
concurrency:
  group: frontend-image-${{ github.event.release.tag_name || inputs.version }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select immutable release source
        env:
          REQUESTED_TAG: ${{ github.event.release.tag_name || inputs.version }}
        run: python3 deploy/release/release.py select-tag --version "$REQUESTED_TAG"
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
      - name: Install locked dependencies and build
        run: |
          corepack enable
          corepack prepare pnpm@10.8.0 --activate
          pnpm install --frozen-lockfile
          pnpm build
          git rev-parse HEAD > dist/SOURCE_COMMIT
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v3
        with:
          registry: registry.cn-hangzhou.aliyuncs.com
          username: ${{ secrets.IMAGE_USER }}
          password: ${{ secrets.IMAGE_PASS }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/release/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: |
            thingspanel/thingspanel-vue:${{ env.VERSION }}
            ghcr.io/${{ env.OWNER_LC }}/thingspanel-vue:${{ env.VERSION }}
            registry.cn-hangzhou.aliyuncs.com/thingspanel/thingspanel-vue:${{ env.VERSION }}
      - name: Record verified registry manifests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 deploy/release/release.py record-image --version "$VERSION" --component frontend --image thingspanel-vue
          gh release upload "$VERSION" release-records/frontend-image.json --clobber
