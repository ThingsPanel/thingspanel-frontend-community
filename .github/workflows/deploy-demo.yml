name: deploy community frontend to enterprise demo

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.11

      - name: Cache pnpm modules
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies and build
        run: |
          npm install -g pnpm@8.15.5
          pnpm i
          pnpm run build:4096

      - name: Package build
        run: tar -czf dist-demo.tar.gz -C dist .

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci-deploy
          ping: 100.105.12.123

      - name: Upload Demo frontend over Tailscale
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            root@100.105.12.123 \
            'cat > /home/thingspanel/nginx/www/dist-demo.tar.gz' \
            < dist-demo.tar.gz

      - name: Deploy and verify Demo frontend
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            root@100.105.12.123 'bash -s' <<'REMOTE_SCRIPT'
          set -euo pipefail
          target=/home/thingspanel/nginx/www
          package=$target/dist-demo.tar.gz
          staging=$target/dist.new
          backup=$target/dist.previous

          test -d "$target/dist"
          test -s "$package"
          rm -rf "$staging" "$backup"
          mkdir -p "$staging"
          tar -xzf "$package" -C "$staging"
          test -s "$staging/index.html"

          widget=$(find "$staging/assets" -maxdepth 1 -type f -name 'ThingsVisWidget-*.js' -print -quit)
          test -n "$widget"
          if grep -q 'no_aggregate' "$widget"; then
            echo 'The staged ThingsVisWidget still contains the legacy no_aggregate fallback.' >&2
            exit 1
          fi

          mv "$target/dist" "$backup"
          mv "$staging" "$target/dist"
          if ! nginx -t || ! nginx -s reload; then
            rm -rf "$target/dist"
            mv "$backup" "$target/dist"
            exit 1
          fi

          rm -rf "$backup" "$package"
          echo "Demo frontend deployed: $(basename "$widget")"
          REMOTE_SCRIPT

